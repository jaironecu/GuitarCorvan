name: Compilar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar código
      uses: actions/checkout@v4

    - name: Extraer archivo ZIP
      run: unzip GuitarCorvan.zip -d codigo_fuente

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Construir la aplicacion
      run: |
        cd codigo_fuente
        if [ -d "GuitarCorvan" ]; then cd GuitarCorvan; fi
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        
        # Limpiamos las versiones incorrectas de TarsosDSP
        sed -i -e '/[Tt]arsos/d' app/build.gradle.kts
        
        # Descargamos el motor de audio exclusivo para Android y lo conectamos
        mkdir -p app/libs
        curl -sL "https://0110.be/releases/TarsosDSP/TarsosDSP-latest/TarsosDSP-Android-latest.jar" -o app/libs/tarsos.jar
        echo 'dependencies { implementation(files("libs/tarsos.jar")) }' >> app/build.gradle.kts
        
        gradle assembleDebug

    - name: Entregar APK
      uses: actions/upload-artifact@v4
      with:
        name: aplicacion-guitar-corvan
        path: codigo_fuente/**/app/build/outputs/apk/debug/*.apk
